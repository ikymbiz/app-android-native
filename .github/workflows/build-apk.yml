name: Mobile App Builder
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'アプリの表示名'
        default: 'My App'
      app_id:
        description: 'パッケージ名 (com.example.app)'
        default: 'com.example.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20 }
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # 1. Capacitorの依存関係を定義した package.json を作成
      - name: Create package.json for Capacitor dependencies
        run: |
          echo '{
            "name": "web-to-native-app",
            "version": "1.0.0",
            "description": "Auto-generated project for Capacitor dependencies",
            "license": "MIT",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }' > package.json
          cat package.json

      # 2. 必要なライブラリをインストール
      - name: Install Dependencies
        run: npm install

      # 3. アップロードされた www.zip を解凍
      - name: Extract Web Assets
        run: |
          rm -rf www
          mkdir www
          if [ -f "www.zip" ]; then
            unzip -o www.zip -d www
          else
            echo "www.zip not found. Creating dummy index.html"
            echo "<html><body><h1>Update your www.zip!</h1></body></html>" > www/index.html
          fi
          ls -l www

      # 4. Capacitorの設定ファイルを生成
      - name: Configure Capacitor
        run: |
          echo '{
            "appId": "${{ github.event.inputs.app_id }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      # 5. Androidプロジェクトの構成
      - name: Android Platform Setup
        run: |
          npx cap add android || true
          npx cap sync android

      # 6. APKのビルド
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. 成果物のアップロード
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

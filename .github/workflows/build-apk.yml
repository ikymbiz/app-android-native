name: Mobile App Builder
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'アプリの表示名'
        default: 'My App'
      app_id:
        description: 'パッケージ名 (com.example.app)'
        default: 'com.example.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install Dependencies
        run: npm install

      # ========================================================
      # 【ここを修正】www.zip を解凍して www フォルダを作成する
      # ========================================================
      - name: Extract Web Assets
        run: |
          # www フォルダがあれば一旦削除し、クリーンな状態にする
          rm -rf www
          mkdir www
          # アップロードされた www.zip を www フォルダに解凍する
          unzip -o www.zip -d www
          # 解凍できているか確認（index.html があるか等）
          ls -l www

      # 入力された変数で設定ファイルを上書き生成する
      - name: Configure Capacitor
        run: |
          echo '{
            "appId": "${{ github.event.inputs.app_id }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Android Platform Setup
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
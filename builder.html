<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Native App Cloud Builder</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #1e1e1e; color: white; }
        .toolbar { padding: 15px; background: #2d2d2d; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #444; }
        .editor-container { flex-grow: 1; display: flex; }
        textarea { width: 100%; height: 100%; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; padding: 20px; border: none; outline: none; font-size: 16px; resize: none; }
        input, button { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #3c3c3c; color: white; }
        button { background: #0e639c; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #1177bb; }
        #status { font-size: 12px; color: #aaa; margin-left: auto; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="text" id="appName" placeholder="アプリ名" value="My App">
    <input type="text" id="appId" placeholder="com.example.app" value="com.example.app">
    <button id="deployBtn">🚀 保存してビルド開始</button>
    <div id="status">待機中...</div>
</div>

<div class="editor-container">
    <textarea id="codeEditor"><!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>App</title></head>
<body>
    <h1>Hello World!</h1>
</body>
</html></textarea>
</div>

<script>
    const GITHUB_CONFIG = {
        token: 'あなたのTOKEN',
        owner: 'ユーザー名',
        repo: 'リポジトリ名'
    };

    document.getElementById('deployBtn').onclick = async () => {
        const status = document.getElementById('status');
        const content = document.getElementById('codeEditor').value;
        const appName = document.getElementById('appName').value;
        const appId = document.getElementById('appId').value;

        try {
            status.innerText = '1/2 ファイルを更新中...';
            
            // ① 現在のファイルのSHA（バージョン識別子）を取得
            const fileRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/www/index.html`, {
                headers: { 'Authorization': `Bearer ${GITHUB_CONFIG.token}` }
            });
            const fileData = await fileRes.json();

            // ② HTMLファイルを更新
            await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/www/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${GITHUB_CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'Update index.html via Builder',
                    content: btoa(unescape(encodeURIComponent(content))), // Base64エンコード
                    sha: fileData.sha
                })
            });

            status.innerText = '2/2 ビルド命令を送信中...';

            // ③ GitHub Actionsを起動
            const actionRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/actions/workflows/build-apk.yml/dispatches`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${GITHUB_CONFIG.token}`, 'Accept': 'application/vnd.github+json' },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: { app_name: appName, app_id: appId }
                })
            });

            if (actionRes.ok) {
                status.innerText = '✅ 完了！Actionsタブを確認してください。';
            }
        } catch (e) {
            status.innerText = '❌ エラーが発生しました。';
            console.error(e);
        }
    };
</script>
</body>
</html>
